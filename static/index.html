<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FunASR 实时语音转文字</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <main class="container">
      <header class="hero">
        <h1>实时语音转文字</h1>
        <p>低延迟流式识别（仅 ASR）</p>
      </header>

      <section class="panel controls">
        <label for="backendUrl">后端地址</label>
        <input id="backendUrl" type="text" placeholder="如: http://localhost:8005" />
        <button id="saveBackendBtn">保存地址</button>
      </section>

      <section class="panel controls">
        <label for="audioSource">录音设备</label>
        <select id="audioSource"></select>
        <button id="refreshDevices">刷新设备</button>
        <button id="startBtn">开始录音</button>
        <button id="stopBtn" disabled>结束录音</button>
        <button id="downloadBtn" disabled>下载 .txt</button>
      </section>

      <section class="panel">
        <h2>实时识别文本</h2>
        <textarea id="liveText" readonly placeholder="录音过程中会实时显示识别文本..."></textarea>
      </section>

      <p id="status">状态：待机</p>
    </main>

    <script src="/static/main.js"></script>
  </body>
</html>
