<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FunASR + Qwen3 实时语音转文字</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>实时语音转文字（局域网版）</h1>

      <section class="panel controls">
        <label for="audioSource">录音设备：</label>
        <select id="audioSource"></select>
        <button id="refreshDevices">刷新设备</button>
        <button id="startBtn">开始录音</button>
        <button id="stopBtn" disabled>结束录音</button>
      </section>

      <section class="panel">
        <h2>实时识别</h2>
        <textarea id="liveText" readonly placeholder="识别结果会显示在这里..."></textarea>
      </section>

      <section class="panel">
        <div class="row">
          <h2>Qwen3 整理后的 Markdown</h2>
          <button id="optimizeBtn" disabled>整理优化</button>
          <button id="downloadBtn" disabled>下载 .md</button>
        </div>
        <textarea id="mdText" readonly placeholder="整理后的文档会显示在这里..."></textarea>
      </section>

      <p id="status">状态：待机</p>
    </main>

    <script src="/static/main.js"></script>
  </body>
</html>
